<!DOCTYPE html>
<!--
  Исходник OG-картинки для /cases/. Рендерится в PNG командой:
    node _tools/opensource/build.mjs --og
  (или вручную headless-хромом в 1200×630 → images/og-cases.png)
-->
<html lang="ru">
<head>
<meta charset="utf-8" />
<style>
  /* Шрифты со своего домена: без обращений к fonts.googleapis.com и fonts.gstatic.com.
     Файлы вариативные — одно начертание на сабсет покрывает весь диапазон 100–900.
     unicode-range оставляет браузеру только нужные сабсеты (русская страница — cyrillic + latin). */
  @font-face{
    font-family:'Roboto';
    font-style:normal;
    font-weight:100 900;
    font-stretch:100%;
    font-display:swap;
    src:url('../../files/fonts/roboto-cyrillic.woff2') format('woff2');
    unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face{
    font-family:'Roboto';
    font-style:normal;
    font-weight:100 900;
    font-stretch:100%;
    font-display:swap;
    src:url('../../files/fonts/roboto-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face{
    font-family:'Roboto';
    font-style:normal;
    font-weight:100 900;
    font-stretch:100%;
    font-display:swap;
    src:url('../../files/fonts/roboto-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face{
    font-family:'Roboto Condensed';
    font-style:normal;
    font-weight:100 900;
    font-display:swap;
    src:url('../../files/fonts/roboto-condensed-cyrillic.woff2') format('woff2');
    unicode-range:U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
  }
  @font-face{
    font-family:'Roboto Condensed';
    font-style:normal;
    font-weight:100 900;
    font-display:swap;
    src:url('../../files/fonts/roboto-condensed-latin.woff2') format('woff2');
    unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }
  @font-face{
    font-family:'Roboto Condensed';
    font-style:normal;
    font-weight:100 900;
    font-display:swap;
    src:url('../../files/fonts/roboto-condensed-latin-ext.woff2') format('woff2');
    unicode-range:U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }

  :root{
    --ink:#000d29; --ink-soft:#26324a; --gold:#b89168; --gold-dk:#96723f;
    --cream:#faf8f4; --cream2:#f3ede3; --line:#e8e1d6; --muted:#5c6472;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{width:1200px;height:630px;overflow:hidden;}
  body{
    background:linear-gradient(160deg,var(--cream) 0%,#fff 55%,var(--cream2) 100%);
    font-family:'Roboto',Arial,sans-serif;color:var(--ink);
    display:flex;flex-direction:column;justify-content:space-between;
    padding:46px 60px;position:relative;
  }
  body:before{
    content:"";position:absolute;top:-220px;right:-180px;width:660px;height:660px;border-radius:50%;
    background:radial-gradient(circle at center,rgba(184,145,104,.22),rgba(184,145,104,0) 70%);
  }
  body:after{
    content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:var(--gold);
  }
  .top{position:relative;display:flex;align-items:center;gap:14px;}
  .eyebrow{
    font-family:'Roboto Condensed';letter-spacing:.16em;text-transform:uppercase;
    font-size:17px;font-weight:700;color:var(--gold-dk);
    background:var(--cream2);border:1px solid var(--line);padding:9px 20px;border-radius:999px;
  }
  .mid{position:relative;}
  h1{
    font-family:'Roboto Condensed';font-size:66px;line-height:1.04;font-weight:700;
    letter-spacing:-.015em;max-width:20ch;
  }
  h1 em{font-style:normal;color:var(--gold-dk);}
  .sub{margin-top:18px;font-size:24px;color:var(--ink-soft);max-width:36ch;line-height:1.35;}
  .cats{position:relative;display:flex;flex-wrap:wrap;gap:9px;max-width:1000px;margin-top:22px;}
  .cats span{
    font-size:16px;color:var(--muted);background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 14px;white-space:nowrap;
  }
  .bot{position:relative;display:flex;align-items:flex-end;justify-content:space-between;}
  .who{display:flex;flex-direction:column;gap:4px;}
  .who b{font-family:'Roboto Condensed';font-size:27px;font-weight:700;letter-spacing:.01em;}
  .who span{font-size:19px;color:var(--muted);}
  .stats{display:flex;gap:36px;}
  .stats div{display:flex;flex-direction:column;align-items:flex-end;}
  .stats b{font-family:'Roboto Condensed';font-size:42px;font-weight:700;line-height:1;color:var(--ink);}
  .stats span{font-size:16px;color:var(--muted);margin-top:5px;}
</style>
</head>
<body>

<div class="top">
  <p class="eyebrow">Кейсы · истории клиентов</p>
</div>

<div class="mid">
  <h1>26 историй экспертов, которые <em>выстроили онлайн-проект</em></h1>
  <p class="sub">Что было до работы, что изменилось после — с цифрами по доходу.</p>
  <div class="cats">
    <span>психологи</span><span>коучи</span><span>врачи</span><span>астрологи</span>
    <span>маркетологи</span><span>оценщики</span><span>тренеры</span><span>наставники</span>
  </div>
</div>

<div class="bot">
  <div class="who">
    <b>Алишер Отабаев</b>
    <span>alisherotabaev.com/cases</span>
  </div>
  <div class="stats">
    <div><b>26</b><span>кейсов</span></div>
    <div><b>2,5 млн</b><span>крупнейший</span></div>
  </div>
</div>

</body>
</html>
